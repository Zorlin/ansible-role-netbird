---
# tasks file for ansible-role-netbird
- name: Add some required packages
  package:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-debian

- name: Setup APT Repo
  ansible.builtin.deb822_repository:
    name: netbird
    state: present
    types: deb
    uris: https://pkgs.netbird.io/debian
    suites: stable
    components: main
    signed_by: https://pkgs.netbird.io/debian/public.key

- name: Update apt cache
  apt:
    update_cache: true

- name: Install netbird
  apt:
    name: netbird
    state: present

- name: Ensure netbird is up
  shell:
    cmd: 'netbird status | grep "Daemon status"'
  register: netbird_status
  changed_when: false
  ignore_errors: true
  when: netbird_register is true

- name: Register Netbird peer
  shell:
    cmd: 'netbird up --management-url {{ netbird_mgmt_url }} --setup-key {{ netbird_setup_key }} '
  when: "netbird_register is true and 'NeedsLogin' in netbird_status.stdout"
